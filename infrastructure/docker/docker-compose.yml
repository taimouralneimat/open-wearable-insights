# Open Wearable Insights — local development stack
# All services bind to 127.0.0.1 (loopback) only.
# No health data leaves the machine.

services:
  postgres:
    # 2.17.2-pg16 (previously pinned here) carries ~380 CRITICAL/HIGH CVE
    # findings (19 CRITICAL) across its Alpine base + bundled Go tools —
    # found via `trivy image` against the actual running image, not just
    # the fs/SBOM scans this session ran against the app's own code.
    # 2.29.2-pg16 (current as of 2026-09-07, same PostgreSQL 16 major
    # version, same TimescaleDB extension family) cuts that to 79 findings
    # (4 CRITICAL) on the same scan. NOT applied to the running container
    # by this change alone — bumping requires `docker compose pull &&
    # docker compose up -d postgres` against the real local dev database,
    # a state-changing action outside terminal-automated scope this
    # session; likely also needs `ALTER EXTENSION timescaledb UPDATE;`
    # once, per TimescaleDB's own upgrade convention for a version jump
    # this size. Re-scan after bumping again, same reproducibility
    # reasoning as the ollama image's exact tag below.
    image: timescale/timescaledb:2.29.2-pg16
    container_name: open-wearable-insights-postgres
    environment:
      POSTGRES_USER: owi
      POSTGRES_PASSWORD: owi-dev-only-local
      POSTGRES_DB: owi
      # TimescaleDB extension is loaded via init SQL; the image includes it.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data
      - ./init-timescaledb.sql:/docker-entrypoint-initdb.d/00-init-timescaledb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U owi -d owi"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    # 0.5.1 (previously pinned here) predates model families like qwen3 —
    # pulling OWI_LLM_MODEL's default (qwen3:8b) against it fails with
    # "requires a newer version of Ollama." Bumped while live-verifying the
    # LLM coach wiring this session; re-pin to a specific newer version
    # (not :latest) whenever bumping again, same reproducibility reasoning
    # as the postgres image's exact tag above.
    image: ollama/ollama:0.32.15
    container_name: open-wearable-insights-ollama
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./volumes/ollama:/root/.ollama
    restart: unless-stopped
    # The app works fully without Ollama. This service is optional.
    profiles:
      - llm

# Volumes are gitignored (see .gitignore). They live outside the repo conceptually
# but Docker requires a relative path; the .gitignore excludes ./volumes/.