name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Health-data guard — reject any *.fit outside synthetic fixtures / Connect IQ
  # ---------------------------------------------------------------------------
  health-data-guard:
    name: Health-data guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Reject non-synthetic FIT files
        run: |
          set -euo pipefail
          # Find all .fit files not under packages/test-data/**/synthetic*.fit
          # or apps/garmin-connect-iq/**
          bad=$(find . -type f -name '*.fit' \
            ! -path './packages/test-data/*' \
            ! -path './apps/garmin-connect-iq/*' \
            ! -path './.git/*' || true)
          if [ -n "$bad" ]; then
            echo "::error::Found non-synthetic FIT files that may contain real health data:"
            echo "$bad"
            exit 1
          fi
          # Ensure synthetic fixtures are named correctly
          bad_named=$(find ./packages/test-data -type f -name '*.fit' \
            ! -name 'synthetic*.fit' || true)
          if [ -n "$bad_named" ]; then
            echo "::error::FIT fixtures under packages/test-data must be named synthetic*.fit:"
            echo "$bad_named"
            exit 1
          fi
          echo "✓ Health-data guard passed."

  # ---------------------------------------------------------------------------
  # Secret scanning — Gitleaks
  # ---------------------------------------------------------------------------
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # Backend — build & test (Java 21, Gradle)
  # ---------------------------------------------------------------------------
  backend-build:
    name: Backend build & test
    runs-on: ubuntu-latest
    needs: [health-data-guard, secret-scan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('services/api/**/*.gradle*', 'services/api/**/libs.versions.toml') }}
          restore-keys: gradle-${{ runner.os }}-
      - name: Build & test
        working-directory: services/api
        run: ./gradlew clean build --no-daemon --continue
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-test-reports
          path: services/api/build/reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Flutter — analyze & test (web)
  # ---------------------------------------------------------------------------
  flutter-build:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    needs: [health-data-guard, secret-scan]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: apps/flutter
        run: flutter pub get
      - name: Analyze
        working-directory: apps/flutter
        run: flutter analyze
      - name: Test
        working-directory: apps/flutter
        run: flutter test

  # ---------------------------------------------------------------------------
  # SBOM generation (CycloneDX) — backend
  # ---------------------------------------------------------------------------
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [backend-build]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Generate CycloneDX SBOM
        working-directory: services/api
        run: ./gradlew cyclonedxBom --no-daemon
      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-backend
          path: services/api/build/reports/
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Container & dependency scan (Trivy)
  # ---------------------------------------------------------------------------
  trivy-scan:
    name: Trivy dependency scan
    runs-on: ubuntu-latest
    needs: [health-data-guard]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true