name: open_wearable_insights
description: Privacy-first, local-first wearable analytics client for Open Wearable Insights.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Routing
  go_router: ^14.2.7
  # HTTP client
  dio: ^5.7.0
  # Charts (declared for a future chart-widget pass; not yet wired into any
  # page — every trend view today renders its own custom bars/rows instead)
  fl_chart: ^0.69.0
  # Secure storage (mobile)
  flutter_secure_storage: ^9.2.2
  # Misc
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/