name: open_wearable_insights
description: Privacy-first, local-first wearable analytics client for Open Wearable Insights.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  # Routing
  go_router: ^14.2.7
  # HTTP client
  dio: ^5.7.0
  # Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  # Charts
  fl_chart: ^0.69.0
  # Secure storage (mobile)
  flutter_secure_storage: ^9.2.2
  # Misc
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Code generation
  build_runner: ^2.4.12
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
  # assets:
  #   - assets/